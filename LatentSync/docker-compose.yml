services:
  latentsync:
    build: .
    image: latentsync:try
    ports:
      - "8001:8001"
    volumes:
      - latentsync-hf:/models
    environment:
      HF_HOME: /models
      MPLBACKEND: Agg
      LATENTSYNC_API_KEY: ${LATENTSYNC_API_KEY:?Set LATENTSYNC_API_KEY in .env}
    gpus: all
    restart: unless-stopped

volumes:
  latentsync-hf:
